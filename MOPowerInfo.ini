; ============================================================================
; MOPowerInfo v1.0 —— 建造栏悬停增强
; 悬停建造图标时显示：建造耗时 / 单项耗电 / 当前电力 / 克制标签
; 需要 MOPowerInfo.dll + MOPowerInfo.dll.inj + 本文件，放在游戏根目录。
; ============================================================================

[PowerInfo]
; 总开关：0 = 完全原版
Enable=1

; 是否写调试日志（MOPowerInfo.log）。正式使用建议 0
Log=0

; 1 = 追加"克制 反步兵/反装甲/反建筑/反空军/反隐形/反间谍"这一行
ShowCounter=1

; 1 = 首次悬停时把全部单位类型的判定导出到日志（仅排查用，需要 Log=1）
DumpAll=0
